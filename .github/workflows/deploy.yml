name: CI

# Vercel deploys automatically on every push to main once both projects
# (frontend + backend) are imported. This workflow only runs lint + build
# checks so broken code never reaches Vercel.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20.x"

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ─── Backend ───
      - name: Backend — generate Prisma client
        working-directory: backend
        run: pnpm exec prisma generate

      - name: Backend — build
        working-directory: backend
        run: pnpm exec nest build

      # ─── Frontend ───
      - name: Frontend — build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
        run: pnpm run build
